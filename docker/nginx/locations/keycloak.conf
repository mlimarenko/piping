location /realms/ {
    set $piping_keycloak_upstream "keycloak:8080";
    proxy_pass http://$piping_keycloak_upstream;
    include /etc/nginx/proxy-common.conf;
}

location /resources/ {
    set $piping_keycloak_upstream "keycloak:8080";
    proxy_pass http://$piping_keycloak_upstream;
    include /etc/nginx/proxy-common.conf;
}
