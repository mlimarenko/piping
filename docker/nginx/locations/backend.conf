location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location = /nginx_status {
    stub_status;
    access_log off;
}

location /api/v1/ {
    proxy_pass http://piping_backend;
    include /etc/nginx/proxy-common.conf;
}

location /proxy/v1/ {
    proxy_pass http://piping_backend;
    include /etc/nginx/proxy-common.conf;
}
