events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream piping_frontend {
        zone piping_frontend 64k;
        server frontend:8080 resolve;
    }

    upstream piping_backend {
        zone piping_backend 64k;
        server backend:7000 resolve;
    }

    # Same class of bug as apps/web/nginx.conf: several locations here
    # (/api/v1/, /proxy/v1/, /realms/, /resources/, /assets/) are proxy_pass
    # targets defined with a trailing slash, so nginx auto-redirects a bare
    # request (e.g. /api/v1) to add the slash using its own scheme/host/port
    # instead of what the client actually connected with. A relative redirect
    # avoids downgrading scheme or leaking an internal port on any of them.
    absolute_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header QUIC-Status $http3 always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    server {
        listen 80 default_server;
        server_name _;
        include /etc/nginx/generated/redirect.conf;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /nginx_status {
            stub_status;
            access_log off;
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 308 https://$piping_https_authority$request_uri;
        }
    }

    include /etc/nginx/generated/client-body-limits.conf;
    include /etc/nginx/generated/https.conf;
}
