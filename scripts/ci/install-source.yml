include:
- project: $COMPONENTS_CATALOG_PROJECT
  file: /jobs/tests/script.yml
  inputs:
    job-name: install:source
    script-path: scripts/ci-compose-native.py
    args: --install
    rules-policy: never
    runner-tags: [ci-medium]
    needs: []
    artifacts-enabled: false

install:source:
  # The privileged service owns a disposable engine, never the runner socket.
  timeout: 20m
  allow_failure: true
  image:
    name: $CI_TOOLS_IMAGE
    entrypoint: ['']
    kubernetes:
      user: '0:0'
  variables:
    GIT_DEPTH: '0'
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /builds/pwa164-${CI_JOB_ID}-tls
    DOCKER_CERT_PATH: /builds/pwa164-${CI_JOB_ID}-tls/client
    DOCKER_TLS_VERIFY: '1'
    HEALTHCHECK_TCP_PORT: '2376'
    PIPING_INSTALL_TEST_FRONTEND_IMAGE: gitlab.piping.space:4567/piping-space/products/piping/piping.app/frontend@sha256:6e9796a4aad6e166f19936f684204dfe4b0af720235fe4ea830990a40affe8d8
  services:
  - name: docker:29.8.2-dind
    alias: docker
    command:
    - sh
    - -ec
    - exec dockerd-entrypoint.sh --data-root="/builds/pwa164-${CI_JOB_ID}-store" --label=piping.fixture=install-lifecycle
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'
    changes:
      paths: &install-source-paths
      - install.sh
      - Makefile
      - env/dev.env
      - env/images.env
      - docker/nginx/**/*
      - docker-compose*.yml
      - tests/compose/test_install_https.py
      - tests/compose/test_install_lifecycle.py
      - tests/compose/docker-compose.licensing.yml
      - tests/compose/docker-compose.licensing-cloud.yml
      - scripts/license-e2e-fixture.sh
      - tests/ci/test_license_fixture.py
      - scripts/public_release.py
      - tests/ci/test_public_artifacts.py
      - .github/workflows/release-docker-images.yml
      - scripts/deploy_release_bundle.py
      - scripts/ci/apply_release_bundle.py
      - scripts/ci/compose_delivery_contract.py
      - scripts/ci/postgres_migration_contract.py
      - scripts/rebaseline-sqlx-0001.sh
      - scripts/rebaseline_sqlx.py
      - tests/ci/test_sqlx_rebaseline.py
      - tests/ci/test_deploy_compose_release.py
      - tests/ci/test_compose_image_contract.py
      - scripts/ci-compose-native.py
      - tests/ci/test_native_fixture_transport.py
      - scripts/ci/install-source.yml
      - scripts/ci/product-release.yml
      - scripts/ci/helper-source.yml
      - .gitlab-ci.yml
    when: on_success
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
    changes:
      compare_to: '$CI_COMMIT_BEFORE_SHA'
      paths: *install-source-paths
    when: on_success
  - when: never
  script:
  - |
    set +x
    set -eu
    umask 077
    test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
    case "$CI_TOOLS_IMAGE" in
      "$CI_REGISTRY/"*) ;;
      *) printf '%s\n' 'Installer tools image must belong to CI_REGISTRY' >&2; exit 1 ;;
    esac
    mkdir -p "$CI_PROJECT_DIR/.ci"
    private_root="$(mktemp -d "$CI_PROJECT_DIR/.ci/install-private.XXXXXX")"
    trap 'python3 -c "import shutil,sys; shutil.rmtree(sys.argv[1])" "$private_root"' EXIT
    export DOCKER_CONFIG="$private_root/docker-auth"
    mkdir "$DOCKER_CONFIG"
    daemon_status=0
    timeout 30 docker info >"$private_root/daemon.log" 2>&1 || daemon_status=$?
    if [ "$daemon_status" -ne 0 ]; then
      printf 'Installer disposable Docker daemon unavailable (exit=%s)\n' "$daemon_status" >&2
      exit 1
    fi
    # Only the predefined job identity authenticates this tools-image pull.
    # No auth config or raw command output leaves this private scratch.
    login_status=0
    printf '%s' "$CI_JOB_TOKEN" | timeout 60 docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" >"$private_root/login.log" 2>&1 || login_status=$?
    if [ "$login_status" -ne 0 ]; then
      printf 'Installer registry login failed (exit=%s); verify CI job-token access\n' "$login_status" >&2
      exit 1
    fi
    pull_status=0
    timeout 180 docker pull "$CI_TOOLS_IMAGE" >"$private_root/pull.log" 2>&1 || pull_status=$?
    if [ "$pull_status" -ne 0 ]; then
      printf 'Installer tools image pull failed (exit=%s); verify central tools project job-token allowlist\n' "$pull_status" >&2
      exit 1
    fi
    PIPING_NATIVE_ARTIFACT_ROOT="$private_root" python3 - --client-unittest tests.ci.test_deploy_compose_release tests.ci.test_compose_image_contract tests.ci.test_native_fixture_transport tests.ci.test_sqlx_rebaseline < scripts/ci-compose-native.py || {
      printf '%s\n' 'Installer boundary tests failed' >&2
      exit 1
    }
    # Real application images and their schema helper are one immutable old24
    # regression cohort; the launcher/TLS inputs still come from this commit.
    fixture_revision="$(python3 -c 'import runpy; print(runpy.run_path("scripts/ci-compose-native.py")["ARTIFACT_HELPER_REVISION"])')"
    git show "${fixture_revision}:env/images.env" > "$private_root/images.env"
    while IFS='=' read -r key reference; do
      case "$key" in PIPING_BACKEND_IMAGE|PIPING_FRONTEND_IMAGE|PIPING_ANSIBLE_RUNNER_IMAGE)
        timeout 180 docker pull "$reference" >"$private_root/image-pull.log" 2>&1 || {
          printf '%s\n' 'Installer release image pull failed' >&2; exit 1;
        } ;;
      esac
    done < "$private_root/images.env"
    for reference in "$PIPING_INSTALL_TEST_FRONTEND_IMAGE" postgres:18-alpine redis:8.6-alpine nginx:1.30-alpine; do
      timeout 180 docker pull "$reference" >"$private_root/image-pull.log" 2>&1 || {
        printf '%s\n' 'Installer fixture image pull failed' >&2; exit 1;
      }
    done
    python3 scripts/ci-compose-native.py --install --image "$CI_TOOLS_IMAGE"
