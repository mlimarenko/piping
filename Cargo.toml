[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/ansible-runner",
    "crates/contracts",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "signal", "process"] }
tracing = "0.1.44"
anyhow = "1.0.102"
thiserror = "2.0.18"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "http2", "stream"] }
chrono = { version = "0.4.44", features = ["serde", "clock"] }
uuid = { version = "1.23.1", features = ["v4", "v5", "v7", "serde"] }
regex = "1.12.3"
# Constant-time equality for secret comparison. Already in the lock file as a
# transitive dependency of the hashing crates, so this costs no new supply chain.
subtle = "2.6.1"
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
# `deny` rather than `forbid`: the proxy child `pre_exec` in
# apps/api/src/proxy/unix_sys.rs needs `unsafe` for the TIOCSCTTY ioctl that
# gives the child its controlling terminal, and `forbid` cannot be overridden
# by its scoped `#[allow(unsafe_code, reason = "...")]`. Any unsafe block
# without such an allow fails the build.
unsafe_code = "deny"
# `allow`: public items here are not all documented — undocumented `pub mod`
# declarations in the crate roots are enough to make `deny` fail the build.
missing_docs = "allow"
# `allow`: public types here exist without `#[derive(Debug)]` (for instance
# `SqlxConnectionFilterPresetRepository`), so enabling the lint fails the build.
missing_debug_implementations = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` (currently zero violations): forces crate-internal items to be
# `pub(crate)` rather than `pub`. `dead_code` never flags an unused `pub` item —
# it is assumed to be external API — so narrowed visibility is what lets the
# lint see dead code.
unreachable_pub = "deny"
# `allow`: each integration-test target sees every workspace dependency as
# unused even when the library uses it, so the lint cannot separate real unused
# dependencies from that artifact.
unused_crate_dependencies = "allow"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
# `all` is the enforced bar. The pedantic, cargo and nursery groups stay
# "allow": their lints are inert unless promoted individually, as
# `cognitive_complexity` is below.
all = { level = "warn", priority = -2 }
pedantic = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
# `cognitive_complexity` lives in the `nursery` group, so the
# `cognitive-complexity-threshold` in clippy.toml is inert while the group is
# `allow`. Promote this one lint (priority 0 > nursery's -1) so the threshold
# is enforced.
cognitive_complexity = "warn"
# Fail the build:
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
exit = "deny"
# Warn only:
unreachable = "warn"
panic = "warn"
expect_used = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = 3
# ThinLTO + codegen-units=16, not `lto = true` / `codegen-units = 1`: the
# 8 GB CI runner cannot hold the opt-level=3 codegen of the whole backend in one
# unit and rustc is OOM-killed. 16 units keep the peak under the limit and
# ThinLTO recovers cross-unit optimization at link; for this I/O-bound
# axum/sqlx server binary the runtime delta is within noise. Both keys are sized
# for that runner.
lto = "thin"
codegen-units = 16
