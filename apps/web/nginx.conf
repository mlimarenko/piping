# Honor the edge/terminator's X-Forwarded-Proto so wss:// URLs (e.g. the live
# terminal WebSocket) are built correctly. This container terminates plain HTTP,
# so $scheme is always "http"; trusting it would downgrade the proxied proto to
# http and make the backend emit insecure ws:// URLs on an https page. Fall back
# to $scheme only when no upstream proxy set the header (direct/local access).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This container terminates plain HTTP behind an HTTPS-terminating edge
    # (Istio here). Without this, nginx's own automatic trailing-slash redirect
    # for the /api/v1/ proxy_pass location (e.g. bare /api/v1 -> /api/v1/) uses
    # its own $scheme ("http") and listen port (:8080), downgrading the client
    # from HTTPS and leaking the internal port. A relative Location lets the
    # browser resolve it against the page's actual https:// origin instead.
    absolute_redirect off;

    # Rendered at container start from the SSH file-transfer upload policy.
    client_max_body_size __PIPING_NGINX_CLIENT_MAX_BODY_SIZE__;
    client_body_timeout 600s;
    proxy_request_buffering off;

    # Security response headers (applied to all responses; `always` covers errors).
    # Note: nginx resets inherited add_header in any location that defines its own,
    # so these are repeated in the /assets/ location below.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # 'unsafe-eval' is required by swagger-ui-react on /api-docs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA: route unknown paths to index.html so React Router handles them.
    # index.html must always be revalidated (cheap ETag 304): without an explicit
    # Cache-Control browsers apply heuristic freshness and keep serving a stale
    # index.html after a deploy, which pins users to old content-hashed bundles.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Re-declare security headers: nginx drops inherited add_header when a
        # location defines its own.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Proxy API calls through to the backend service on the shared docker network.
    location /api/v1/ {
        proxy_pass http://backend:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Large inventory pages are consumed as streaming API responses by the
        # browser. Avoid spilling multi-page JSON responses to nginx temp files.
        proxy_buffering off;
    }

    # Assets: long cache; content-hashed by Vite.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers: nginx drops inherited add_header when a
        # location defines its own.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # 'unsafe-eval' is required by swagger-ui-react on /api-docs
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Self-hosted map assets: real files only. Do not fall back to index.html,
    # otherwise a missing style/PMTiles file looks like a successful SPA HTML
    # response and MapLibre fails late instead of using the SVG fallback.
    location /map-style/ {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location /maps/ {
        try_files $uri =404;
        gzip off;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location /fallback/ {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
