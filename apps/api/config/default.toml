run_mode = "backend"
start_mode = "start"

[server]
bind = "0.0.0.0:8080"
# Empty = allow all origins (no credentials). To restrict, list the allowed
# origins here or, for env-driven deployments, set a comma-separated
# PIPING_SERVER__CORS_ALLOWED_ORIGINS=https://app.example.com,http://localhost:5173
cors_allowed_origins = []

[database]
url = ""
max_connections = 10
min_connections = 2
acquire_timeout_seconds = 30
idle_timeout_seconds = 600
max_lifetime_seconds = 1800

[redis]
url = ""

[secrets.cipher]
key_material_ref = "env:PIPING_SECRETS__CIPHER_KEY_B64"
version = "v1"

[observability]
log_level = "INFO"
log_output_format = "json"
noise_window_ms = 30000
noise_max_events_per_window = 40
noise_overflow_mode = "summarize"
# OTLP export is opt-in: the shipped default targets no collector, because the
# estate has no external OTLP entry and a product default must not name
# cluster-internal DNS. Enable per deployment with
# PIPING_OBSERVABILITY__OTEL_ENABLED=true plus an endpoint; the estate's k8s
# contour sets
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring.svc.piping-eu:4318.
otel_enabled = false
otel_exporter_otlp_endpoint = ""

[monitoring]
# Both endpoints fail closed: an empty token denies every scrape. /metrics and
# /api/v1/metrics answer 401 without metrics_token (query `token` or header
# X-Piping-Monitoring-Token); /api/v1/monitoring/sd answers 401 without a bearer
# sd_token. A token is required to serve either endpoint; sd_public_enabled is
# the only way to expose service discovery without one.
metrics_token = ""
sd_token = ""
sd_public_enabled = false
sd_default_port = 9100
sd_default_scheme = "http"
sd_default_metrics_path = "/metrics"
sd_default_job = "node"
sd_max_limit = 50000
query_url = ""
query_token = ""
query_timeout_ms = 3000
query_max_queries = 12
# Background observability list-labels poller cadence (milliseconds).
list_poll_interval_ms = 60000
# When true (default), hosts with no explicit `monitoring_metric_set`
# assignment still surface every metric query whose `default_show_in_list`
# flag is on. Flip to false to make list-view metrics opt-in via assignments.
default_set_fallback_enabled = true

[proxy]
ws_token_ttl_seconds = 120
ssh_detach_grace_seconds = 60
validation_timeout_ms = 3000
admin_list_max_limit = 500
guacd_host = "127.0.0.1"
guacd_port = 4822

[sync_runtime]
callback_base_url = "http://localhost:8080"
webhook_signature_window_seconds = 300
webhook_dedup_window_seconds = 3600
outbox_worker_batch_size = 100
outbox_worker_poll_interval_ms = 1000
outbox_retry_max_attempts = 8
outbox_retry_backoff_ms = 2000
dedup_retention_hours = 24

[playbook_runtime]
self_callback_base_url = "http://localhost:7000"
run_poll_interval_ms = 2000
schedule_poll_interval_ms = 5000
run_lease_limit = 50000
run_lease_ttl_seconds = 300
schedule_lease_limit = 25
schedule_lease_ttl_seconds = 120
max_concurrent_runs = 16
max_concurrent_runs_per_group = 50000
timeout_reap_limit = 50
exec_max_bytes_per_stream = 65536

[official_catalog]
# Baked read-only snapshot of the official playbook catalog (copied into the
# image next to config/ and migrations/). Resolved relative to the working
# directory; local dev falls back to the repo-root ansible/playbooks tree.
baked_dir = "ansible/playbooks"
# Writable overlay the git-refresh worker checks out into. When it contains a
# valid piping-playbooks.yaml it is preferred over the baked snapshot; empty
# work dir means baked-only (air-gapped installs never need network access).
work_dir = "data/official-catalog"
refresh_enabled = true
refresh_interval_seconds = 3600
repo_url = "https://github.com/mlimarenko/piping"
repo_ref = "main"
sparse_path = "ansible/playbooks"

[ansible_runner]
base_url = "http://ansible-runner:8080"
request_timeout_ms = 30000
shared_secret = ""
forks = 128

[license]
base_url = ""
request_timeout_ms = 5000
refresh_interval_seconds = 21600

[security]
allow_weak_dev_secrets = false
# Escape hatch for hermetic environments only: allow outbound requests to
# resolve to private/internal addresses (disables the SSRF guard). Never enable
# in a user-facing deployment. Env: PIPING_SECURITY__SSRF_ALLOW_PRIVATE
ssrf_allow_private = false

[auth]
local_enabled = true
session_ttl_seconds = 86400
session_cookie_name = "piping_session"
cookie_domain = ""
cookie_secure = false
cookie_same_site = "Lax"
password_min_length = 8
password_pepper = "dev-pepper"
oidc_enabled = false
oidc_issuer_url = ""
oidc_client_id = ""
oidc_redirect_url = ""
oidc_scopes = ["openid", "profile", "email"]
oidc_group_claim = "groups"
oidc_clock_skew_seconds = 30

[auth.api_tokens]
enabled = true
max_active_per_user = 20
min_ttl_seconds = 60
max_ttl_seconds = 31536000
default_ttl_seconds = 0
secret_bytes = 32
mcp_rate_limit_per_minute = 300
