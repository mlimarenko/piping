global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: piping-hosts-default
    honor_labels: true
    http_sd_configs:
      - url: >-
          http://backend:7000/api/v1/monitoring/sd?kind=all&target=address&port=9100&group_by=none&label=env:dev
        refresh_interval: 30s

    # Optional: normalize labels for dashboards.
    relabel_configs:
      - source_labels: [piping_host_name]
        target_label: instance
        regex: (.+)
      - source_labels: [piping_target_kind]
        target_label: target_kind
      - source_labels: [piping_site]
        target_label: site
      - source_labels: [piping_role]
        target_label: role
      - source_labels: [piping_tenant]
        target_label: tenant
