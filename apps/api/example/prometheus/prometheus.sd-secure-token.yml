global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # Backend app metrics (/metrics) with bearer token.
  - job_name: piping-backend-secure
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:7000
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/piping-metrics-token

  # Service discovery endpoint with bearer token under http_sd_configs.
  - job_name: piping-hosts-secure-sd
    honor_labels: true
    http_sd_configs:
      - url: >-
          http://backend:7000/api/v1/monitoring/sd?kind=all&target=address&port=9100&group_by=site,role&label=env:prod
        refresh_interval: 30s
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/piping-sd-token

    relabel_configs:
      - source_labels: [piping_host_name]
        target_label: instance
        regex: (.+)
      - source_labels: [piping_site]
        target_label: site
      - source_labels: [piping_role]
        target_label: role
