services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: piping
      POSTGRES_PASSWORD: piping-dev-password
      POSTGRES_DB: piping_selfhost
    ports:
      - "55433:5432"
    volumes:
      - backend-selfhost-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.1
    command: redis-server --requirepass dev-redis-password
    ports:
      - "56380:6379"
    volumes:
      - backend-selfhost-redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIPING_LICENSE_BAKED_PUBLIC_KEY_PEM: |-
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEA6wfrFIl5II8AGPRbrIZqj2FeKAt3uiXeYyh/pAlWMKA=
          -----END PUBLIC KEY-----
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PIPING_SERVER__BIND: 0.0.0.0:8080
      PIPING_DATABASE__URL: postgresql://piping:piping-dev-password@postgres:5432/piping_selfhost
      PIPING_REDIS__URL: redis://:dev-redis-password@redis:6379/0
      PIPING_SECRETS__CIPHER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PIPING_SECURITY__ALLOW_WEAK_DEV_SECRETS: "true"
      PIPING_AUTH__LOCAL_ENABLED: "true"
      PIPING_AUTH__COOKIE_SECURE: "false"
      PIPING_AUTH__COOKIE_SAME_SITE: Lax
      PIPING_LICENSE__BASE_URL: http://host.docker.internal:8090
      PIPING_LICENSE__REQUEST_TIMEOUT_MS: "5000"
      PIPING_LICENSE__REFRESH_INTERVAL_SECONDS: "60"
    ports:
      - "18080:8080"

volumes:
  backend-selfhost-postgres-data:
  backend-selfhost-redis-data:
