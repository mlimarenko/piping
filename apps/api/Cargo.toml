[package]
name = "piping-backend"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file = "LICENSE"
publish = false

[package.metadata.cargo-machete]
# `md-5` is used, but imported under its RustCrypto lib name `md5`
# (contexts/device_management/protocol/dvrip.rs). cargo-machete's name-based
# scan does not follow the crate rename, so it must be ignored explicitly.
ignored = ["md-5"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { version = "0.60.2", default-features = false }
serde_yml = { package = "serde_yaml_ng", version = "0.10" }
sqlx = { workspace = true }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
opentelemetry = { version = "0.33.1", features = ["logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-appender-tracing = "0.33.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true }
config = "0.15.27"
thiserror = { workspace = true }
chrono = { workspace = true }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }
reqwest = { workspace = true }
regex = "1.13.1"
strum = { version = "0.28", features = ["derive"] }
url = "2.5.8"
percent-encoding = "2.3.2"
async-trait = "0.1.92"
axum-extra = { version = "0.12.6", features = ["cookie"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
openidconnect = { version = "4.1.0", features = ["reqwest", "rustls-tls"] }
cookie = "0.18.2"
base64 = "0.23.1"
des = "0.9.0"
bytes = "1.12.1"
futures-util = "0.3.34"
openssl = "0.10.82"
png = "0.18.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
opentelemetry_sdk = { version = "0.33.1", features = ["logs", "metrics", "rt-tokio"] }
tracing-opentelemetry = "0.34.0"
once_cell = "1.21.4"
prometheus = "0.14.0"
libc = "0.2.191"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rustix = { version = "1.1.6", features = ["process", "pty", "termios"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
hmac = "0.13.0"
subtle = { workspace = true }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
tempfile = "3.27.0"
tokio-util = { version = "0.7.20", features = ["io"] }
saffron = "0.1.0"
chrono-tz = "0.10.4"
dashmap = "6.2.1"
vt100 = "0.18.1"
piping-contracts = { path = "../../crates/contracts" }

[build-dependencies]
semver = "1.0.28"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[[bin]]
name = "piping-backend"
path = "src/main.rs"

[[bin]]
name = "inventory-transfer"
path = "src/bin/inventory_transfer.rs"

[[bin]]
name = "convert-fhrp-auth-keys"
path = "src/bin/convert_fhrp_auth_keys.rs"

[dev-dependencies]
flate2 = "1.1.10"
sqlx = { workspace = true }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
tokio = { workspace = true }
argon2 = "0.6.0"

[lints]
workspace = true
