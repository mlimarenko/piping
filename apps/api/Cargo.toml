[package]
name = "piping-backend"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
publish = false

[package.metadata.cargo-machete]
# `md-5` is used, but imported under its RustCrypto lib name `md5`
# (contexts/device_management/protocol/dvrip.rs). cargo-machete's name-based
# scan does not follow the crate rename, so it must be ignored explicitly.
ignored = ["md-5"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { package = "serde_yaml_ng", version = "0.10" }
sqlx = { workspace = true }
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
opentelemetry = { version = "0.31.0", features = ["logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-appender-tracing = "0.31.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true }
config = "0.15.22"
thiserror = { workspace = true }
chrono = { workspace = true }
tower-http = { version = "0.6.8", features = ["compression-gzip", "cors", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }
reqwest = { workspace = true }
regex = "1.12.3"
strum = { version = "0.27", features = ["derive"] }
url = "2.5.8"
percent-encoding = "2.3.2"
async-trait = "0.1.89"
axum-extra = { version = "0.12.6", features = ["cookie"] }
argon2 = "0.5.3"
openidconnect = { version = "4.0.1", features = ["reqwest", "rustls-tls"] }
cookie = "0.18.1"
base64 = "0.22.1"
des = "0.8.1"
bytes = "1.11.0"
futures-util = "0.3.32"
openssl = "0.10.79"
png = "0.18.1"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
opentelemetry_sdk = { version = "0.31.0", features = ["logs", "metrics", "rt-tokio"] }
tracing-opentelemetry = "0.32.1"
once_cell = "1.21.4"
prometheus = "0.14.0"
libc = "0.2.186"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rustix = { version = "1.1.4", features = ["process", "pty", "termios"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
hmac = "0.12.1"
subtle = { workspace = true }
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"
hex = "0.4.3"
tempfile = "3.23.0"
tokio-util = { version = "0.7.17", features = ["io"] }
saffron = "0.1.0"
chrono-tz = "0.10.4"
dashmap = "6.1.0"
piping-contracts = { path = "../../crates/contracts" }

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[[bin]]
name = "piping-backend"
path = "src/main.rs"

[dev-dependencies]
flate2 = "1.1.9"
sqlx = { workspace = true }
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
tokio = { workspace = true }
argon2 = "0.5.3"

[lints]
workspace = true
